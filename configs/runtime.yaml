# Kaggle submission settings. Remote execution is opt-in per source snapshot.
schema_version: 1
repo_url: https://github.com/Tienledaithandong/ruleshift-vlm.git
branch: main
project_dir_colab: /content/ruleshift-vlm
project_dir_kaggle: /kaggle/working/ruleshift-vlm

checkpoint:
  source: hf
  model_key: qwen2.5-vl-3b       # refers to configs/models.yaml
  dataset_slug: null             # only for a dataset containing model weights
  local_path: null

execution:
  status: P1_PILOT_UNDER_REVIEW
  allow_remote_run: false
  note: >-
    The switch controls the remote pilot. A locked evaluation has its own
    validation and freeze prerequisites.
