# DEVELOPMENT-ONLY configuration for RuleShift-Grid. Not a frozen test set.
# All values below are dev hypotheses, not reported results. Unknown keys
# (e.g. render_size, observation_mode) are informational and ignored in v1.
schema_version: 1
split: dev
name: ruleshift-grid-dev-v0.3
description: >-
  Development defaults for the RuleShift-Grid benchmark. The v0.3 generator
  uses collision-free retry streams and rejects maps without a reachable side-0
  diagnostic face; side 0 is the only face that separates base from the
  hazard/sign hypotheses. The generator uses width/height/wall_density; the
  simulator applies the slip and hazard values to the public rule objects at
  reset.

width: 7
height: 7
wall_density: 0.18
max_env_steps: 60
tool_budget: 3
inspect_cost: 2
read_sign_cost: 1
inspect_range: 2
inspect_error: 0.05
baseline_slip: 0.10
slippery_slip: 0.80
shift_probability: 0.35
shift_window: [10, 40]
soft_hazard_damage: -2.0
soft_hazard_recovery_steps: 1
goal_reward: 10.0
step_cost: -0.05
max_health: 3
lethal_trap: false
door_required: false
advisor_cost: 2
max_decisions: 200

render_size: 224
observation_mode: symbolic
