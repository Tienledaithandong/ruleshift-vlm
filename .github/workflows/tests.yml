name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run test suite
        run: python -m pytest -q
      - name: Script CLI smoke test
        # Every entrypoint must at least parse its arguments, so a dead flag or
        # a broken import fails CI instead of surfacing in the runbook.
        run: |
          for script in scripts/*.py; do
            echo "== $script"
            python "$script" --help > /dev/null
          done
      - name: Regenerate synthetic artifacts
        run: python scripts/reproduce_all.py
      - name: Assert the working tree stays clean
        # Anything left behind belongs in .gitignore or should not be written.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "reproduce_all.py left untracked or modified files:"
            git status --porcelain
            exit 1
          fi
      - name: Show tracked files
        run: git ls-files
