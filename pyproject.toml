[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleshift-vlm"
version = "0.1.0"
description = "CPU-first research harness for value-aware probing under hidden dynamics shifts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
# The public schema and agent interfaces are usable without simulator dependencies.
dependencies = []

[project.optional-dependencies]
env = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26",
    "Pillow>=10",
    "PyYAML>=6",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8,<10",
    "gymnasium>=1.0,<2",
    "numpy>=1.26",
    "Pillow>=10",
    "PyYAML>=6",
    "matplotlib>=3.8",
]
# Real frozen-VLM backend (scripts/run_real_pilot.py). Not installed by the
# `dev` extra, because the CPU harness and its tests never need torch.
# Install with: python -m pip install -e '.[vlm]'
vlm = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26",
    "Pillow>=10",
    "PyYAML>=6",
    "torch>=2.1",
    "transformers>=4.45",
    "accelerate>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruleshift = ["prompts/*.txt"]

[tool.setuptools.data-files]
"share/ruleshift/configs" = ["configs/dev.yaml", "configs/preregistered_test.yaml"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
